services:
  music-streamer:
    build:
      context: ./MusicStreamerBackend
      dockerfile: Dockerfile
    environment:
      - MediaLocation=/music
      - ConnectionStrings__MusicStreamerDb=Host=postgres:5432; Database=musicStreamerDb; Username=admin; Password=adminpassword                                                                                                                                                                                               
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - /Volumes/ExtSSD/Music:/music:ro
    user: root


  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: musicStreamerDb
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: user@domain.com
      PGADMIN_DEFAULT_PASSWORD: SuperSecret
    ports:
      - "80:80"
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin_data:
